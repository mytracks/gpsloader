schema: spec-driven

# Project context: guardrails for all OpenSpec artifacts.
# Background on the old app is in docs/legacy-analysis.md and docs/legacy-device-catalog.md and is only
# referenced here.
context: |
  ## Product
  myTracks Loader (name decided on 2026-11-19, change rename-and-icon; repository, target, modules and
  bundle ID keep the name gpsloader) is a small standalone macOS app. It reads GPS loggers and saves the
  recordings as GPX files. It replaces the logger functions of the app myTracks, developed for almost
  20 years; these functions are removed there.
  The audience is existing myTracks customers and other owners of such loggers.
  The scope covers:
  - Direct mode: choose a device (serial port /dev/cu.* or paired Bluetooth device), read the data,
    write GPX, optionally erase the logger memory.
  - File mode: convert files from a memory card or USB storage (NMEA, FIT, TCX, IGC, NAL, wintec_tes,
    sbp/sbn and others) to GPX.
  Track management, maps, geotagging and editing are not part of it.

  ## Language (decided by the developer on 2026-11-19)
  - All files in the repositories are in English: OpenSpec artifacts, README, docs, code, identifiers
    and comments. The conversation with the developer is in German. Archived changes from before
    2026-11-19 stay in German as history.
  - The app UI is localized in German and English (German texts address the user formally with "Sie").

  ## Distribution
  - Download through GitHub releases of https://github.com/mytracks/gpsloader (decided on 2026-11-19,
    change split-repositories), NOT through the Mac App Store. The release contains the notarized ZIP
    myTracks-Loader-<version>.zip and its checksum (Scripts/release.sh --publish).
  - Developer ID signed, notarized, hardened runtime. The app sandbox is not required (direct access to
    /dev/cu.*, IOKit/HID and IOBluetooth).
  - The app is a universal binary (arm64 + x86_64) without helper programs and without any Rosetta
    dependency.
  - License of the app (decided on 2026-11-10, change gpl-driver-package): GPL-3.0-or-later for the app,
    GPSLoaderKit and GPSLoggerKitGPL; GPSLoggerKit stays MIT. Every shipped version MUST offer its
    complete source code (address: build setting GPSLOADER_SOURCE_CODE_URL, enforced by
    Scripts/verify-bundle.sh for release builds). Source (decided on 2026-11-13): the public repository
    https://github.com/mytracks/gpsloader; every version is pushed there before the release and tagged,
    the packages with their tags in their repositories.

  ## Technical guardrails (decided)
  - Minimum deployment target: macOS 12 (decided on 2026-11-02; the SDK of Xcode 27 supports nothing
    older).
  - Own code only in Swift. No Objective-C, C or C++ source code in the project. System APIs such as
    IOKit, IOHID, termios/POSIX and IOBluetooth are used directly from Swift.
  - Modern Swift where possible: Swift 6 language mode, strict concurrency, async/await, actors,
    Sendable, value types, Swift Package Manager for modularization. APIs newer than macOS 12 only with
    an `#available` fallback.
  - UI based on AppKit. SwiftUI only where it works reliably on macOS 12.
  - Driver architecture: one shared driver protocol (async, cancellable, with progress); all drivers are
    native Swift drivers in GPSLoggerKit or GPSLoggerKitGPL (see below). The device interface
    (DeviceConnection/DeviceProtocol, own code) lives in GPSLoggerKit since change gns2000-driver; the
    transports (serial, USB HID, Bluetooth RFCOMM) live in GPSLoaderKit. Still open: BG728 (Maptaq Trip IQ)
    and WSG-2000 NAL files.
  - No gpsbabel (decided on 2026-11-13, change remove-gpsbabel): the app ships neither gpsbabel nor Qt nor
    a Rosetta installer and does not need Rosetta. The gpsbabel 1.7.0 binary of the old app (x86_64,
    docs/legacy-analysis.md, section 3.1; myTracks history, commit e0d1f18) only serves black-box
    cross-checks of ports; it is copied to the scratchpad, never into the repository and never into the
    app. There too it is run only as a process with an argument array, never through a shell.
  - Bluetooth loggers (except the GNS2000, which runs over IOBluetooth/RFCOMM) are only used through the
    serial port /dev/cu.* that macOS creates after pairing. There is no RFCOMM bridge of our own.
  - No runtime dependency on Python, Perl or other interpreters. No system()/popen(), no shell command
    lines with placeholders as in the old app.
  - Device logic (protocols, parsers, GPX generation) lives in UI-independent Swift packages. They must be
    testable without hardware: transport as a protocol, mock transport, recorded device dialogs as test
    fixtures.
  - Output: GPX 1.1, times in UTC (ISO 8601 with Z), without myTracks extensions. Tracks are split as the
    device or the driver dictates.

  ## Packages in their own repositories (decided on 2026-11-19, change split-repositories)
  - Formats and device protocols live in two public repositories of their own with their own OpenSpec,
    rules and releases (tags `x.y.z`, pre-release below 1.0.0):
    - GPSLoggerKit (MIT, macOS 12+ and iOS/iPadOS 27+, clean-room):
      https://github.com/mytracks/GPSLoggerKit. myTracks Neo (App Store) uses it too.
      Families: NMEA, GPX, IGC, FIT, TCX, Suunto SML, KML/KMZ, CSV loggers (V-900, iBlue), GNS 2000;
      WSG-2000 NAL is planned there as black-box.
    - GPSLoggerKitGPL (GPL-3.0-or-later, macOS only, ports from gpsbabel 1.7.0 and igotu2gpx):
      https://github.com/mytracks/GPSLoggerKitGPL. Families: SkyTraq, MTK/Holux, Wintec,
      Locosys/Navilink, Medion GoPal, Magellan, XAiOX iTrackU, Alan Map500, i-GotU.
  - The clean-room rule of GPSLoggerKit and the porting rules (permitted licenses, file headers,
    gpsbabel tag, "no way back") are in the openspec/config.yaml of the respective repository and apply
    there. No GPL source code is read in this repository.
  - The app uses both packages in GPSLoaderKit by URL and `.upToNextMinor`; the versions are in
    Packages/GPSLoaderKit/Package.resolved. Release builds use only these versions.
  - A change works in exactly one repository. A feature that concerns a package and the app is a change
    in the package repository with a package release, followed by a change here that raises the version
    and adds catalog, transports or UI. For development a local package checkout can be used instead of
    the URL (README, section "Packages").
  - Device catalog (module DeviceDrivers), transports (serial, USB HID, Bluetooth RFCOMM) and UI stay in
    this repository; the specs here apply to them.
  - Still open: BG728 (Maptaq Trip IQ); in which package the family is built is not decided yet.

  ## Scope (decided)
  - The device catalog of the old app (docs/legacy-device-catalog.md) is supported with these deviations:
    - Dropped: all LoadMyTracks devices; all drivers based on script languages (Royaltek
      RGM-3800/RBT-2300/GOSGET S1, Gisteq DPL700/CD111, XAiOX iTrackU Nemerix/SiRF, MainNav, Suunto Ambit
      via ambit2gpx, fit2tcx); the Palm OS formats cetus and coto (missing in gpsbabel 1.7.0).
    - Added again: i-GotU GT-100, GT-120, GT-200e, GT-600 and GT-800/Pro (native).
  - No takeover of logger configurations from myTracks.
  - No real-time tracking.
  - Diagnostic capture (confirmed on 2026-11-02, implemented in setup-foundation): all sent and received
    bytes with timestamps in a file that users can send to the developer. Captures also serve as test
    fixtures. Since 2026-11-14 (change support-package) it is always on; users send it in the support
    package (ZIP, saved only locally, never sent by the app).

  ## Suggestions from the exploration (not yet confirmed)
  - Defer Wintec WPL 1000 / Navilock NL-456DL (only an x86 binary without source code exists).
  - Way back to myTracks: hand the generated GPX file over with "Open in myTracks".
  - Updates through Sparkle, as a change of its own.

  ## Development conditions
  - The developer is very experienced with macOS and myTracks. Functional questions about devices are
    useful, explanations of basics are not.
  - The developer has NO test devices for i-GotU and Bluetooth loggers. Users take over tests with real
    hardware for those. For the other devices hardware verification is always a manual step of the
    developer; the agent has no hardware.
  - The original myTracks code is in input/mytracks4mac/. It is a Git repository, read only, not
    versioned (.gitignore), and must neither be changed nor taken into the build. Deleted code (i-GotU,
    gpsbabel 1.7.0) is available through the Git history. Proposals and designs refer to
    docs/legacy-analysis.md or the source files instead of deriving knowledge again.
  - The goal is a modern reimplementation of the behavior, not a 1:1 port. Weaknesses of the old app
    (see legacy-analysis.md, section 8) are not taken over.

rules:
  proposal:
    - Write in English.
    - Name the affected devices and driver families (according to docs/legacy-device-catalog.md) explicitly.
    - Always include a section "Out of scope".
    - If the change touches one of the not yet confirmed suggestions, get the developer's decision
      explicitly and record it.
    - For a new logger family decide whether it is built in GPSLoggerKit (clean-room) or in
      GPSLoggerKitGPL (port), and get the developer's decision. The family itself is built with a change
      in the package repository; the change here names the package version and only adds catalog,
      transport or UI.
  specs:
    - Write in English. Every requirement statement contains the keyword SHALL or MUST, because the
      OpenSpec validator requires it (for example "The app SHALL …").
    - Requirement texts at most 500 characters; examples and edge cases go into scenarios.
    - Scenarios in WHEN/THEN form, testable without real hardware where possible (mock transport,
      recorded answers).
    - Protocol details (commands, answer formats, byte layouts) belong in the specs of the respective
      driver capability, not in the UI specs.
  design:
    - Write in English.
    - Reference relevant old source files below input/mytracks4mac/ with their path (deleted code with
      the commit).
    - "Handle Swift 6 concurrency explicitly: isolation, Sendable, timeouts, cancellation."
  tasks:
    - Write in English.
    - Every protocol/parser task has a test task with fixtures.
    - List manual hardware tests as separate, clearly marked tasks ("[manual, hardware]"); tests that
      users have to take over as "[manual, user]".
