name: gpsloader

options:
  bundleIdPrefix: info.stichling
  developmentLanguage: en
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GPSLoaderKit:
    path: Packages/GPSLoaderKit

settings:
  base:
    DEVELOPMENT_TEAM: 4TNB35NY7G
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  gpsloader:
    type: application
    platform: macOS
    sources:
      - path: App
      # License texts -> Contents/Resources/Licenses: GPL-3.0 (license of the app, copy of LICENSE)
      # and the MIT license of GPSLoggerKit
      - path: Vendor/Licenses/GPL-3.0.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses
      - path: Vendor/Licenses/MIT-GPSLoggerKit.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses
    dependencies:
      - package: GPSLoaderKit
        product: LoggerCore
      - package: GPSLoaderKit
        product: SerialTransport
      - package: GPSLoaderKit
        product: GPXExport
      - package: GPSLoaderKit
        product: DiagnosticCapture
      - package: GPSLoaderKit
        product: FileConversion
      - package: GPSLoaderKit
        product: DeviceDrivers
      - package: GPSLoaderKit
        product: HIDTransport
      - package: GPSLoaderKit
        product: BluetoothTransport
      - package: GPSLoaderKit
        product: SupportPackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stichling.gpsloader
        # The name users see (change rename-and-icon); target, bundle ID and modules keep "gpsloader".
        PRODUCT_NAME: "myTracks Loader"
        PRODUCT_MODULE_NAME: gpsloader
        GENERATE_INFOPLIST_FILE: YES
        # Partial Info.plist, merged with the generated one: only GPSLoaderSourceCodeURL.
        INFOPLIST_FILE: App/Info.plist
        # Where the complete source code of the app is offered (GPL-3.0-or-later). Required for release builds
        # (Scripts/verify-bundle.sh); public GitHub repository, decided by the developer on 2026-11-13.
        GPSLOADER_SOURCE_CODE_URL: "https://github.com/mytracks/gpsloader"
        INFOPLIST_KEY_CFBundleDisplayName: "myTracks Loader"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Dirk Stichling"
        # Shown by macOS before the first Bluetooth access (GNS 2000, change gns2000-driver); German in App/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "myTracks Loader connects to GPS loggers such as the GNS 2000 over Bluetooth to read their recordings."
        CODE_SIGN_ENTITLEMENTS: App/gpsloader.entitlements
        # App/AppIcon.icon (Icon Composer), generated by Scripts/make-app-icon.swift; Xcode renders the sizes for macOS 12–15.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  gpsloader:
    build:
      targets:
        gpsloader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: GPSLoaderKit/LoggerCoreTests
        - package: GPSLoaderKit/SerialTransportTests
        - package: GPSLoaderKit/GPXExportTests
        - package: GPSLoaderKit/DiagnosticCaptureTests
        - package: GPSLoaderKit/TestSupportTests
        - package: GPSLoaderKit/FileConversionTests
        - package: GPSLoaderKit/DeviceDriversTests
        - package: GPSLoaderKit/HIDTransportTests
        - package: GPSLoaderKit/BluetoothTransportTests
        - package: GPSLoaderKit/SupportPackageTests
    archive:
      config: Release
