name: gpsloader

options:
  bundleIdPrefix: info.stichling
  developmentLanguage: en
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GPSLoaderKit:
    path: Packages/GPSLoaderKit

settings:
  base:
    DEVELOPMENT_TEAM: 4TNB35NY7G
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  gpsloader:
    type: application
    platform: macOS
    sources:
      - path: App
      # gpsbabel 1.7.0 (x86_64) -> Contents/Helpers/gpsbabel (see Vendor/gpsbabel-1.7.0/PROVENANCE.md)
      - path: Vendor/gpsbabel-1.7.0/gpsbabel
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      # License texts -> Contents/Resources/Licenses
      - path: Vendor/gpsbabel-1.7.0/Licenses
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Sign bundled helpers (Hardened Runtime)
        script: "\"${SRCROOT}/Scripts/sign-helpers.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      # x86_64-only helper app that triggers the system's Rosetta installation -> Contents/Helpers
      - target: RosettaInstaller
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Qt Core 5.12.9 for gpsbabel -> Contents/Frameworks
      - framework: Vendor/gpsbabel-1.7.0/QtCoreGpsBabel.framework
        embed: true
        link: false
        codeSign: true
      - package: GPSLoaderKit
        product: LoggerCore
      - package: GPSLoaderKit
        product: SerialTransport
      - package: GPSLoaderKit
        product: GPSBabelRuntime
      - package: GPSLoaderKit
        product: GPXExport
      - package: GPSLoaderKit
        product: DiagnosticCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stichling.gpsloader
        PRODUCT_NAME: gpsloader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: gpsloader
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Dirk Stichling"
        CODE_SIGN_ENTITLEMENTS: App/gpsloader.entitlements
        # The helper signing script writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  RosettaInstaller:
    type: application
    platform: macOS
    sources:
      - path: RosettaInstaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stichling.gpsloader.RosettaInstaller
        PRODUCT_NAME: RosettaInstaller
        # Intel only on purpose: launching it without Rosetta triggers the system's install dialog.
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: "gpsloader Rosetta Installer"
        SKIP_INSTALL: YES

schemes:
  gpsloader:
    build:
      targets:
        gpsloader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: GPSLoaderKit/LoggerCoreTests
        - package: GPSLoaderKit/SerialTransportTests
        - package: GPSLoaderKit/GPSBabelRuntimeTests
        - package: GPSLoaderKit/GPXExportTests
        - package: GPSLoaderKit/DiagnosticCaptureTests
        - package: GPSLoaderKit/TestSupportTests
    archive:
      config: Release
